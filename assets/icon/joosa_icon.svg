<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- Joosa (جوزة) app icon: an amber bolt on deep blue. Full-bleed; launchers apply their own mask. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D5EF0"/>
      <stop offset="1" stop-color="#1A2C8F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.42">
      <stop offset="0" stop-color="#FFD54A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFD54A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#FFA81A"/>
    </linearGradient>
  </defs>
  <g id="background">
    <rect width="108" height="108" fill="url(#bg)"/>
    <circle cx="54" cy="56" r="34" fill="url(#glow)"/>
    <circle cx="54" cy="54" r="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
  </g>
  <g id="foreground">
    <path d="M59 31 L39 58 H52 L48 77 L69 49 H56 Z" fill="#0E1A5C" fill-opacity="0.35" transform="translate(1.2 2.2)" stroke="#0E1A5C" stroke-opacity="0.35" stroke-width="3" stroke-linejoin="round"/>
    <path d="M59 31 L39 58 H52 L48 77 L69 49 H56 Z" fill="url(#bolt)" stroke="url(#bolt)" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
